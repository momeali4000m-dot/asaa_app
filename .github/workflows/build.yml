name: Unzip and Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Esaa.zip
      run: |
        unzip Esaa.zip -d extracted_app
        GRADLE_DIR=$(find extracted_app -name "gradlew" -exec dirname {} \;)
        echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: |
        cd $GRADLE_DIR
        chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        cd $GRADLE_DIR
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          extracted_app/**/build/outputs/apk/debug/*.apk
          extracted_app/**/build/outputs/apk/release/*.apk
