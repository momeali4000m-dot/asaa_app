workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Flutter project
        script: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.example --project-name asaa_app .
          rm -rf lib
          cp -r ../lib .
          cp ../pubspec.yaml .
      - name: Get Flutter packages
        script: |
          cd temp_app
          flutter pub get
      - name: Build APK
        script: |
          cd temp_app
          flutter build apk --release
    artifacts:
      - temp_app/build/app/outputs/flutter-apk/*.apk
